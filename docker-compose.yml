services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  opportunity-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opportunity_service
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5434:5432"
    volumes:
      - opportunity_db_data:/var/lib/postgresql/data

  ingestion-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ingestion_service
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5435:5432"
    volumes:
      - ingestion_db_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5436:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  api-gateway:
    build: ./services/api-gateway
    environment:
      APP_ENV: development
      AUTH_SERVICE_URL: http://auth-service:8001
      OPPORTUNITY_SERVICE_URL: http://opportunity-service:8002
      INGESTION_SERVICE_URL: http://ingestion-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - opportunity-service
      - ingestion-service
      - notification-service
      - redis
      - rabbitmq

  auth-service:
    build: ./services/auth-service
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://scout:scout@auth-db:5432/auth_service
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      - auth-db
      - redis

  opportunity-service:
    build: ./services/opportunity-service
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://scout:scout@opportunity-db:5432/opportunity_service
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      - opportunity-db
      - redis
      - elasticsearch

  ingestion-service:
    build: ./services/ingestion-service
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://scout:scout@ingestion-db:5432/ingestion_service
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OPPORTUNITY_SERVICE_URL: http://opportunity-service:8002
    ports:
      - "8003:8003"
    depends_on:
      - ingestion-db
      - rabbitmq
      - opportunity-service

  notification-service:
    build: ./services/notification-service
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://scout:scout@notification-db:5432/notification_service
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8004:8004"
    depends_on:
      - notification-db
      - rabbitmq

volumes:
  auth_db_data: {}
  opportunity_db_data: {}
  ingestion_db_data: {}
  notification_db_data: {}
