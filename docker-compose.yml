services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    volumes:
      - scout_db:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      SCOUT_ENVIRONMENT: development
      SCOUT_DATABASE_URL: postgresql+asyncpg://scout:scout@db:5432/scout
      SCOUT_REDIS_URL: redis://redis:6379/0
      SCOUT_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker -Q ingestion -l info
    env_file:
      - .env
    environment:
      SCOUT_ENVIRONMENT: development
      SCOUT_DATABASE_URL: postgresql+asyncpg://scout:scout@db:5432/scout
      SCOUT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery beat -l info
    env_file:
      - .env
    environment:
      SCOUT_ENVIRONMENT: development
      SCOUT_DATABASE_URL: postgresql+asyncpg://scout:scout@db:5432/scout
      SCOUT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  scout_db: {}
